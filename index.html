<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Riri &amp; Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbeef0; --panel:#fff7f8; --ink:#4a2a35; --muted:#a07a86;
    --pink:#f49ab0; --pink-d:#e0708f; --line:#f1cdd6;
    --hunger:#ef6b7b; --fun:#f6b84b; --energy:#7cc3f0; --clean:#8fd6a8; --love:#ff7aa8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#2a1d24; --panel:#3a2832; --ink:#ffe9ef; --muted:#c49aa9; --line:#5a3d4a; }
  }
  :root[data-theme="dark"]{ --bg:#2a1d24; --panel:#3a2832; --ink:#ffe9ef; --muted:#c49aa9; --line:#5a3d4a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"Pixelify Sans", ui-monospace, monospace;
       display:flex; justify-content:center; user-select:none; -webkit-user-select:none; overflow:hidden}
  #app{width:100%; max-width:440px; height:100%; display:flex; flex-direction:column; padding:10px 12px 12px; gap:8px}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px}
  h1{font-size:22px; margin:0; font-weight:700; letter-spacing:.5px}
  h1 span{color:var(--pink-d)}
  .love{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600}
  .love .bar{width:84px}
  .tabs{display:flex; gap:6px}
  .tab{flex:1; border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px;
       padding:6px 8px; font:inherit; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px}
  .tab.on{border-color:var(--pink-d); background:var(--pink); color:#fff}
  .tab small{font-size:11px; opacity:.8}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:8px 10px}
  .stat{display:flex; align-items:center; gap:6px; font-size:13px}
  .stat .ic{width:18px; text-align:center}
  .bar{flex:1; height:10px; background:var(--line); border-radius:3px; overflow:hidden; image-rendering:pixelated}
  .bar i{display:block; height:100%; width:50%; transition:width .4s; background-image:linear-gradient(90deg,rgba(255,255,255,.25) 50%,transparent 50%); background-size:6px 100%}
  #stage{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  #wrap{position:relative; height:100%; aspect-ratio:180/260; max-width:100%; border-radius:14px; overflow:hidden; border:3px solid var(--line); box-shadow:0 6px 0 var(--line)}
  canvas{width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; cursor:pointer}
  .bubble{position:absolute; transform:translate(-50%,-100%); background:#fff; color:#4a2a35; border:2px solid #4a2a35; border-radius:10px;
          padding:5px 9px; font-size:14px; white-space:nowrap; pointer-events:none; animation:pop .18s ease-out; box-shadow:0 3px 0 rgba(74,42,53,.25); max-width:70%}
  .bubble:after{content:""; position:absolute; left:50%; bottom:-8px; margin-left:-6px; border:6px solid transparent; border-top-color:#4a2a35; border-bottom:0}
  @keyframes pop{from{transform:translate(-50%,-90%) scale(.6); opacity:0}}
  #toast{position:absolute; left:50%; top:10px; transform:translateX(-50%); background:rgba(74,42,53,.85); color:#fff; padding:5px 10px; border-radius:8px; font-size:13px; white-space:nowrap; opacity:0; transition:opacity .3s; pointer-events:none}
  #toast.show{opacity:1}
  #gamehud{position:absolute; left:8px; right:8px; top:8px; display:none; justify-content:space-between; font-size:16px; font-weight:700; color:#4a2a35; text-shadow:0 1px 0 #fff}
  .actions{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .btn{border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:6px 0 4px; font:inherit; font-size:11px; font-weight:600;
       display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; box-shadow:0 3px 0 var(--line); transition:transform .08s}
  .btn{position:relative}
  .btn .dot{position:absolute; top:-6px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:#ff4f7e; color:#fff; font-size:11px; line-height:18px; display:none; box-shadow:0 0 0 2px var(--bg); animation:pulse 1.4s infinite}
  @keyframes pulse{50%{transform:scale(1.15)}}
  .btn b{font-size:20px; line-height:1.1; font-weight:400}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
  .btn.on{background:var(--pink); color:#fff; border-color:var(--pink-d)}
  #tray{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:none; gap:6px; background:rgba(255,247,248,.95); border:2px solid #4a2a35; border-radius:12px; padding:6px}
  #tray button{font-size:24px; background:none; border:0; cursor:pointer; padding:2px 4px}
  #tray.show{display:flex}
  .bubble.long{white-space:normal; width:min(78%,300px); text-align:center; line-height:1.3}
  .bubble.long.center:after{left:72%}
  /* love box */
  #box{position:fixed; inset:0; background:rgba(60,25,40,.45); display:none; align-items:flex-end; justify-content:center; z-index:10}
  #box.show{display:flex}
  .sheet{width:100%; max-width:440px; max-height:88%; background:var(--panel); border-radius:18px 18px 0 0; border:3px solid var(--line); border-bottom:0;
         display:flex; flex-direction:column; animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px); opacity:0}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 6px; font-size:20px}
  .sheet-head button{border:0; background:none; font:inherit; font-size:20px; color:var(--ink); cursor:pointer}
  .seg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; padding:4px 14px 10px}
  .seg button{position:relative; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:7px 0; font:inherit; font-size:14px; font-weight:600; cursor:pointer}
  .seg button.on{background:var(--pink); border-color:var(--pink-d); color:#fff}
  .seg .n{position:absolute; top:-7px; right:-5px; background:#ff4f7e; color:#fff; border-radius:8px; font-size:10px; padding:1px 5px}
  #boxBody{overflow:auto; padding:0 14px 18px; min-height:220px}
  .item{width:100%; display:flex; align-items:center; gap:10px; text-align:left; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px;
        padding:10px 12px; margin-bottom:8px; font:inherit; cursor:pointer}
  .item .ic{font-size:26px} .item .tt{flex:1; font-size:15px; font-weight:600} .item small{display:block; font-weight:400; color:var(--muted); font-size:12px}
  .new{background:#ff4f7e; color:#fff; font-size:10px; border-radius:6px; padding:2px 6px; font-weight:700}
  .empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:15px; line-height:1.5}
  .paper{background:#fffdf6; color:#4a2a35; border-radius:6px; padding:16px 18px 18px; box-shadow:0 3px 0 #ead9c2;
         background-image:repeating-linear-gradient(#fffdf6 0 27px,#f3dfe4 27px 28px); border-left:4px solid #f49ab0; font-family:Caveat, cursive}
  .paper .ld{font-family:"Pixelify Sans",monospace; font-size:12px; color:#b0808e}
  .paper h3{font-size:28px; margin:2px 0 6px; line-height:1.1}
  .paper .lb{font-size:22px; line-height:28px; white-space:pre-wrap}
  .paper .sg{text-align:right; font-size:24px; margin-top:8px}
  .prow{display:flex; gap:8px; margin-top:12px}
  .pbtn{flex:1; border:2px solid var(--pink-d); background:var(--pink); color:#fff; border-radius:12px; padding:10px; font:inherit; font-size:15px; font-weight:600; cursor:pointer}
  .pbtn.ghost{background:var(--bg); color:var(--ink); border-color:var(--line); flex:0 0 auto}
  .locket{position:relative; width:100%; aspect-ratio:1; border-radius:28px; overflow:hidden; background:#000; box-shadow:0 0 0 4px #f6c34a, 0 6px 0 4px #d9a531}
  .locket img{width:100%; height:100%; object-fit:cover; display:block}
  .locket .cap{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(40,30,35,.55); backdrop-filter:blur(6px); color:#fff;
               padding:6px 14px; border-radius:20px; font-size:16px; white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis}
  .lmeta{text-align:center; color:var(--muted); font-size:13px; margin:12px 0 8px}
  .thumbs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px}
  .thumbs img{width:56px; height:56px; object-fit:cover; border-radius:14px; border:3px solid transparent; cursor:pointer; flex:none}
  .thumbs img.on{border-color:#f6c34a}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Riri <span>&amp;</span> Me</h1>
    <div class="love">💗 <div class="bar"><i id="loveBar" style="background-color:var(--love)"></i></div><span id="loveNum">80%</span></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div class="stat"><span class="ic">🍒</span><div class="bar"><i id="s-hunger" style="background-color:var(--hunger)"></i></div></div>
    <div class="stat"><span class="ic">🎮</span><div class="bar"><i id="s-fun" style="background-color:var(--fun)"></i></div></div>
    <div class="stat"><span class="ic">⚡</span><div class="bar"><i id="s-energy" style="background-color:var(--energy)"></i></div></div>
    <div class="stat"><span class="ic">🫧</span><div class="bar"><i id="s-clean" style="background-color:var(--clean)"></i></div></div>
  </div>
  <div id="stage">
    <div id="wrap">
      <canvas id="game" width="180" height="260"></canvas>
      <div id="toast"></div>
      <div id="gamehud"><span id="gScore">🍒 0</span><span id="gTime">20</span></div>
      <div id="tray">
        <button data-food="🍒">🍒</button><button data-food="🍓">🍓</button><button data-food="🍜">🍜</button>
        <button data-food="🧋">🧋</button><button data-food="🍰">🍰</button><button data-food="🍙">🍙</button>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn" data-act="feed"><b>🍒</b>Feed</button>
    <button class="btn" data-act="play"><b>🎮</b>Play</button>
    <button class="btn" data-act="bath"><b>🫧</b>Bath</button>
    <button class="btn" data-act="sleep"><b>💤</b>Sleep</button>
    <button class="btn" data-act="talk"><b>🎤</b>Talk</button>
    <button class="btn" data-act="hug"><b>💕</b>Hug</button>
    <button class="btn" data-act="box"><b>💌</b>Love<span class="dot" id="boxDot"></span></button>
  </div>
</div>

<div id="box">
  <div class="sheet">
    <div class="sheet-head"><b>💌 Love Box</b><button id="boxClose" aria-label="Close">✕</button></div>
    <div class="seg">
      <button data-tab="letters">✉️ Letters</button><button data-tab="voice">🎧 Voice</button><button data-tab="photos">📸 Photos</button>
    </div>
    <div id="boxBody"></div>
  </div>
</div>
<script src="content.js"></script>
<script>
(() => {
'use strict';
const W = 180, H = 260, GROUND = 242;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const bctx = bg.getContext('2d');
const wrap = document.getElementById('wrap');

// ---------- tiny pixel helpers ----------
let P = lctx, OX = 0, OY = 0;
function p(x, y, w, h, c){ P.fillStyle = c; P.fillRect(Math.round(OX + x), Math.round(OY + y), w, h); }
function pa(x, y, w, h, c){ P.fillStyle = c; P.fillRect(Math.round(x), Math.round(y), w, h); }
function line(x0, y0, x1, y1, th, c){
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  P.fillStyle = c;
  for (let i = 0; i <= n; i++){
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    P.fillRect(Math.round(x - th / 2), Math.round(y - th / 2), th, th);
  }
}
function sprite(rows, x, y, c, s = 1){
  P.fillStyle = c;
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === '1') P.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); });
}
const HEART = ['11011','11111','11111','01110','00100'];
const HEART_S = ['101','111','010'];
const FONT = { M:['101','111','111','101','101'], I:['111','010','010','010','111'], L:['100','100','100','100','111'],
               A:['010','101','111','101','101'], N:['110','101','101','101','101'], O:['111','101','101','101','111'] };

// ---------- state ----------
const DEF = () => ({ hunger: 80, fun: 80, energy: 85, clean: 90 });
const chars = [
  { id:'riri', name:'Riri', homeX:56, cx:56, w:52, h:116, pitch:1.55, phase:0, stats:DEF(),
    lines:['hehe that tickles!','i love you sm 💕','cherries are my fav 🍒','hold my hand?','you\'re so silly','hii babe!','kiss me? 😚','*giggles*','stay with me forever?'] },
  { id:'me', name:'Me', homeX:124, cx:124, w:58, h:130, pitch:1.3, phase:1.7, stats:DEF(),
    lines:['you\'re my favorite person','👍👍','hehe stop that!','wanna get food?','you look cute today','i\'m so lucky','best day ever','love you {o} 💕'] },
];
chars.forEach(c => Object.assign(c, { jy:0, vy:0, grinT:0, eatT:0, talking:false, listening:false, mouthAmp:0, blink:0, nextBlink: 2 + Math.random()*3, wave:0 }));
let sel = 0, love = 80, sleeping = false, hugT = 0, t = 0;
let particles = [], flying = [], bath = null, game = null;

function save(){
  try { localStorage.setItem('riri-pet', JSON.stringify({ chars: chars.map(c => ({ name:c.name, stats:c.stats })), love, ts: Date.now() })); } catch(e){}
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem('riri-pet') || 'null');
    if (!d) return;
    d.chars.forEach((s, i) => { if (chars[i]){ chars[i].name = s.name || chars[i].name; Object.assign(chars[i].stats, s.stats); } });
    love = d.love ?? love;
    const dt = Math.min((Date.now() - (d.ts || Date.now())) / 1000, 12 * 3600);
    decay(dt * 0.5);
  } catch(e){}
}
const clamp = v => Math.max(0, Math.min(100, v));
function decay(dt){
  chars.forEach(c => {
    const s = c.stats;
    s.hunger = clamp(s.hunger - dt / 60);
    s.fun = clamp(s.fun - dt / 45);
    s.clean = clamp(s.clean - dt / 120);
    s.energy = clamp(sleeping ? s.energy + dt * 0.8 : s.energy - dt / 90);
  });
  love = clamp(love - dt / 200);
}
const mood = c => (c.stats.hunger + c.stats.fun + c.stats.energy + c.stats.clean) / 4;
const other = c => chars[1 - chars.indexOf(c)];

// ---------- sound ----------
let actx = null;
function ac(){ if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function boop(f = 660, d = .08, type = 'square', vol = .05, slide = 0){
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, a.currentTime + d);
    g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d);
  } catch(e){}
}

// ---------- background ----------
function flower(x, y, big){
  P = bctx;
  const a = '#f3bcc6', b = '#e79aaa', l = '#bccba5';
  pa(x - 4, y + 3, 3, 1, l); pa(x + 2, y + 3, 3, 1, l); pa(x - 6, y + 2, 2, 1, l); pa(x + 5, y + 2, 2, 1, l);
  pa(x - 1, y - 4, 3, 6, a); pa(x - 4, y - 2, 3, 4, a); pa(x + 2, y - 2, 3, 4, a);
  pa(x, y - 3, 1, 4, b); pa(x - 3, y - 1, 1, 2, b); pa(x + 3, y - 1, 1, 2, b);
  if (big){ pa(x - 6, y, 2, 2, a); pa(x + 5, y, 2, 2, a); pa(x - 1, y - 6, 3, 2, a); }
}
function drawBG(){
  P = bctx;
  pa(0, 0, W, H, '#f7ecdd');
  // wallpaper
  for (let y = 18; y < 190; y += 26) for (let x = (y / 26 % 2 ? 14 : 2); x < 150; x += 26) flower(x, y, (x + y) % 3 === 0);
  // faint wallpaper vines
  P = bctx;
  for (let y = 10; y < 190; y += 13) for (let x = 8; x < 150; x += 13) if ((x * 7 + y * 3) % 5 === 0) pa(x, y, 1, 1, '#e8d8c4');
  // ceiling strip + spotlights
  pa(0, 0, W, 8, '#ece0cf'); pa(0, 8, W, 1, '#ddcdb8');
  [74, 98].forEach(x => { pa(x - 4, 9, 8, 5, '#d9d9de'); pa(x - 3, 14, 6, 2, '#f4f4f8'); pa(x - 2, 10, 2, 2, '#fff'); });
  // framed photo of us
  pa(64, 26, 44, 44, '#e2b446'); pa(65, 27, 42, 42, '#f6cf68'); pa(66, 28, 40, 40, '#fde5ea');
  pa(66, 56, 40, 12, '#f6c9d4');
  sprite(HEART, 73, 40, '#ef6b8b', 2); sprite(HEART, 89, 40, '#ef6b8b', 2);
  pa(84, 22, 4, 4, '#e2b446'); pa(85, 23, 2, 2, '#fde5ea');
  // shelf + tiny cherry jar
  pa(60, 88, 52, 3, '#d8bf9b'); pa(60, 91, 52, 1, '#bfa27c');
  pa(66, 78, 8, 10, '#e9f3f7'); pa(66, 78, 8, 2, '#c9d9e0'); pa(68, 82, 2, 2, '#d8344b'); pa(71, 84, 2, 2, '#d8344b');
  pa(80, 80, 10, 8, '#f49ab0'); pa(81, 78, 8, 2, '#ffc2d1');           // pink box
  pa(96, 76, 3, 12, '#7aa36a'); pa(94, 74, 3, 3, '#f3bcc6'); pa(98, 72, 3, 3, '#f3bcc6'); pa(101, 76, 3, 3, '#f3bcc6'); pa(95, 84, 8, 4, '#fff1d6');
  // sheer curtain right
  for (let x = 140; x < W; x++){
    const c = ((x - 140) % 6 < 3) ? '#f9f1e6' : '#efe2cf';
    pa(x, 9, 1, 186, c);
  }
  pa(138, 9, 2, 186, '#e6d6c0');
  // floor
  pa(0, 190, W, 4, '#e6d5bf'); pa(0, 194, W, 1, '#d6c3aa');
  pa(0, 195, W, 65, '#f3ebe2');
  for (let y = 200; y < H; y += 9) pa(0, y, W, 1, '#e7dccf');
  for (let y = 195, k = 0; y < H; y += 9, k++) for (let x = (k % 2) * 22; x < W; x += 44) pa(x, y, 1, 9, '#e7dccf');
  // plant (left back)
  P = bctx;
  const lf = '#3f7d4c', lf2 = '#5aa063', lf3 = '#2c5e39';
  const fronds = [[24,150,6,108],[24,150,40,112],[24,150,-2,128],[24,150,48,132],[24,150,14,100],[24,150,34,100],[24,150,0,150],[24,150,46,152]];
  fronds.forEach(([x0, y0, x1, y1], i) => {
    line(x0, y0, x1, y1, 2, i % 2 ? lf : lf3);
    const n = 8;
    for (let k = 2; k < n; k++){
      const x = x0 + (x1 - x0) * k / n, y = y0 + (y1 - y0) * k / n;
      const dx = (y1 - y0) / 14, dy = -(x1 - x0) / 14;
      line(x, y, x + dx * (1 - k / n) * 1.6 + 2, y + dy * (1 - k / n) * 1.6 + 3, 1, lf2);
      line(x, y, x - dx * (1 - k / n) * 1.6 - 2, y - dy * (1 - k / n) * 1.6 + 3, 1, lf2);
    }
  });
  pa(14, 168, 22, 24, '#e9e2d8'); pa(12, 164, 26, 5, '#f6f1ea'); pa(14, 186, 22, 6, '#ddd3c6'); pa(16, 170, 2, 14, '#fff');
  pa(24, 150, 2, 16, lf3);
  // rug
  const rug = (cx, cy, rx, ry, c) => { for (let y = -ry; y <= ry; y++){ const w = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry))); pa(cx - w, cy + y, w * 2, 1, c); } };
  rug(90, 240, 78, 14, '#f0b3c2'); rug(90, 240, 72, 11, '#f7cdd7'); rug(90, 240, 60, 7, '#fbdde4');
  for (let a = 0; a < 6.28; a += .5) pa(90 + Math.cos(a) * 66, 240 + Math.sin(a) * 9, 2, 1, '#f0b3c2');
}

// ---------- characters ----------
const DK = '#2b1a14';
function eyes(kind, x1, x2, y){
  if (kind === 'arc'){
    [x1, x2].forEach(x => { p(x - 2, y + 1, 1, 1, DK); p(x - 1, y, 3, 1, DK); p(x + 2, y + 1, 1, 1, DK); });
  } else if (kind === 'closed'){

function faceOf(c){

  if (c.talking){ this_amp = Math.min(1, c.mouthAmp); return ['open-eye', this_amp > .08 ? 'open' : 'smile']; }

}

function outlinePass(){
  const img = lctx.getImageData(0, 0, W, H), d = img.data, a = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) a[i] = d[i * 4 + 3] > 40 ? 1 : 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const i = y * W + x; if (a[i]) continue;
    if ((x > 0 && a[i - 1]) || (x < W - 1 && a[i + 1]) || (y > 0 && a[i - W]) || (y < H - 1 && a[i + W])){
      d[i * 4] = 52; d[i * 4 + 1] = 28; d[i * 4 + 2] = 36; d[i * 4 + 3] = 255;
    }
  }
  lctx.putImageData(img, 0, 0);
}

// ---------- particles ----------
function spawn(type, x, y, o = {}){ particles.push(Object.assign({ type, x, y, vx: (Math.random() - .5) * 10, vy: -12 - Math.random() * 10, life: 1.6, max: 1.6 }, o)); }
function hearts(c, n = 5){ for (let i = 0; i < n; i++) spawn('heart', c.cx + (Math.random() - .5) * 30, GROUND - c.h + 10 + Math.random() * 20, { col: ['#ff6f9a','#ff9ab8','#e9446f'][i % 3] }); }

function drawParticles(dt){
  P = ctx;
  particles = particles.filter(q => (q.life -= dt) > 0);
  particles.forEach(q => {
    q.x += q.vx * dt; q.y += q.vy * dt;
    const a = Math.min(1, q.life / q.max * 2);
    ctx.globalAlpha = a;
    if (q.type === 'heart') sprite(q.small ? HEART_S : HEART, q.x, q.y, q.col);
    else if (q.type === 'z'){ ctx.fillStyle = '#7b8fd6'; ctx.font = (q.s || 8) + 'px "Pixelify Sans", monospace'; ctx.fillText('z', Math.round(q.x), Math.round(q.y)); }
    else if (q.type === 'bubble'){
      const r = q.r;
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(Math.round(q.x - r), Math.round(q.y - r + 1), r * 2, r * 2 - 2); ctx.fillRect(Math.round(q.x - r + 1), Math.round(q.y - r), r * 2 - 2, r * 2);
      ctx.fillStyle = 'rgba(150,200,240,.8)'; ctx.fillRect(Math.round(q.x - r + 1), Math.round(q.y - r + 1), 1, 1);
    } else if (q.type === 'drop'){ ctx.fillStyle = '#7cc3f0'; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 3); }
    else if (q.type === 'spark'){ ctx.fillStyle = '#ffd86b'; ctx.fillRect(Math.round(q.x), Math.round(q.y - 1), 1, 3); ctx.fillRect(Math.round(q.x - 1), Math.round(q.y), 3, 1); }
    else if (q.type === 'text'){ ctx.fillStyle = q.col; ctx.font = 'bold 9px "Pixelify Sans", monospace'; ctx.fillText(q.txt, Math.round(q.x), Math.round(q.y)); }
  });
  ctx.globalAlpha = 1;
}

// ---------- talk (record + squeaky playback) ----------
let rec = null, recTimer = null, analyser = null;
async function talk(){
  if (sleeping || game || bath || reading || voicePlaying) return toast('not right now!');
  const c = chars[sel];
  if (rec){ rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ say(c, 'i can\'t hear you 🥺'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      clearTimeout(recTimer); stream.getTracks().forEach(tk => tk.stop());
      rec = null; c.listening = false; setOn('talk', false);
      try {
        const a = ac(), buf = await a.decodeAudioData(await new Blob(chunks).arrayBuffer());
        const src = a.createBufferSource(); src.buffer = buf; src.playbackRate.value = c.pitch;
        analyser = a.createAnalyser(); analyser.fftSize = 256;
        src.connect(analyser); analyser.connect(a.destination);
        c.talking = true; src.onended = () => { c.talking = false; c.grinT = 1.2; analyser = null; };
        src.start();
      } catch(e){ say(c, 'huh? say again?'); }
    };
    rec.start(); c.listening = true; setOn('talk', true);
    say(c, 'i\'m listening… 👂', 4000);
    recTimer = setTimeout(() => rec && rec.stop(), 4000);
  } catch(e){ say(c, 'let me use the mic? 🎤'); }
}
const abuf = new Uint8Array(256);
function micLevel(){
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(abuf);
  let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / abuf.length) * 5;
}

// ---------- input ----------
function toLogical(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function hit(x, y){
  for (let i = chars.length - 1; i >= 0; i--){ const b = charBox(chars[i]); if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return chars[i]; }
  return null;
}
let dragging = false;
cv.addEventListener('pointerdown', e => {
  ac(); dragging = true; cv.setPointerCapture(e.pointerId);
  const [x, y] = toLogical(e);
  $('tray').classList.remove('show'); setOn('feed', false);
  if (game){ game.x = x; return; }
  if (reading || voicePlaying){ stopMessages(); return; }
  if (!bath && !sleeping && x >= 64 && x <= 108 && y >= 22 && y <= 70){ boop(990, .08, 'sine', .05, 1.3); openBox('photos'); return; }
  const c = hit(x, y); if (!c) return;
  if (bath){ scrub(x, y); return; }
  const i = chars.indexOf(c); if (i !== sel){ sel = i; renderTabs(); }
  if (sleeping){ say(c, ['5 more minutes…','zzz… mm?','*snore*'][Math.floor(Math.random() * 3)], 1600); return; }
  c.vy = -70; c.jy = -1; c.grinT = 1.6; c.wave = 1;
  c.stats.fun = clamp(c.stats.fun + 2); love = clamp(love + .5);
  hearts(c, 3);
  const m = mood(c);
  say(c, m < 30 ? lowLine(c) : c.lines[Math.floor(Math.random() * c.lines.length)]);
  boop(c === chars[0] ? 880 : 620, .09, 'square', .04, 1.4);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const [x, y] = toLogical(e);
  if (game) game.x = x;
  if (bath) scrub(x, y);
});
cv.addEventListener('pointerup', () => dragging = false);
cv.addEventListener('pointercancel', () => dragging = false);
function scrub(x, y){
  const c = bath.c, b = charBox(c);
  if (x < b.x - 4 || x > b.x + b.w + 4 || y < b.y || y > b.y + b.h || bath.rinse) return;
  c.stats.clean = clamp(c.stats.clean + .7);
  if (Math.random() < .6) spawn('bubble', x + (Math.random() - .5) * 8, y + (Math.random() - .5) * 8, { vx: (Math.random() - .5) * 4, vy: -2 - Math.random() * 4, life: 3, max: 3, r: 1 + Math.floor(Math.random() * 3) });
  if (Math.random() < .08) boop(1200 + Math.random() * 600, .04, 'sine', .03);
  if (c.stats.clean >= 100 && !bath.rinse){ bath.rinse = 1.6; say(c, 'squeaky clean! ✨'); c.grinT = 2; }
}
function lowLine(c){
  const s = c.stats, k = Object.keys(s).reduce((a, b) => s[a] < s[b] ? a : b);
  return { hunger:'i\'m hungry… 🥺', fun:'i\'m bored, play with me?', energy:'so sleepy… 😪', clean:'i need a bath lol 🫧' }[k];
}

// ---------- loop ----------
let last = performance.now(), saveT = 0, chatT = 18, secT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  decay(dt);
  if (sleeping && Math.random() < dt * 1.2) chars.forEach(c => spawn('z', c.cx + 8, GROUND - c.h + 8, { vx: 6, vy: -8, life: 2.2, max: 2.2, s: 7 + Math.floor(Math.random() * 4) }));

  // update chars
  chars.forEach(c => {
    c.vy += 400 * dt; c.jy = Math.min(0, c.jy + c.vy * dt); if (c.jy === 0) c.vy = 0;
    c.grinT -= dt; c.eatT -= dt; c.wave -= dt;
    c.nextBlink -= dt; if (c.nextBlink < 0){ c.blink = .12; c.nextBlink = 2 + Math.random() * 4; } c.blink -= dt;
    if (c.talking) c.mouthAmp = c.fake ? (c.fake() ? (Math.sin(t * 17) + 1) * .4 + .1 : 0) : micLevel();
    let target = c.homeX;
    if (hugT > 0) target = c === chars[0] ? 77 : 103;
    if (game && c === chars[sel]) target = Math.max(28, Math.min(152, game.x));
    else if (game) target = c === chars[0] ? 30 : 150;
    c.cx += (target - c.cx) * Math.min(1, dt * (game ? 12 : 5));
  });
  hugT -= dt;

  // food flying
  flying = flying.filter(f => {
    f.t += dt * 1.8; const k = Math.min(1, f.t);
    f.cx = f.x + (f.tx - f.x) * k; f.cy = f.y + (f.ty - f.y) * k - Math.sin(k * Math.PI) * 50;
    if (k >= 1){
      const [v, line] = FOOD[f.e]; const c = f.c;
      c.eatT = 1.3; c.stats.hunger = clamp(c.stats.hunger + v); c.stats.energy = clamp(c.stats.energy + 2);
      setTimeout(() => { say(c, line); hearts(c, 2); c.grinT = 1.2; }, 1300);
      for (let i = 0; i < 4; i++) setTimeout(() => boop(300 + Math.random() * 80, .05, 'square', .04), i * 280);
      save(); return false;
    }
    return true;
  });

  // minigame
  if (game){
    const g = game, c = chars[sel];
    g.t -= dt; g.spawn -= dt;
    if (g.spawn < 0){ g.spawn = .45 + Math.random() * .35; const r = Math.random(); g.items.push({ x: 12 + Math.random() * 156, y: -10, v: 45 + Math.random() * 35 + (20 - g.t) * 2, e: r < .12 ? '💖' : r < .24 ? '🌶️' : '🍒' }); }
    const hy = GROUND - c.h + 30;
    g.items = g.items.filter(it => {
      it.y += it.v * dt;
      if (Math.abs(it.y - hy) < 12 && Math.abs(it.x - c.cx) < 20){
        const pts = it.e === '💖' ? 3 : it.e === '🌶️' ? -2 : 1;
        g.score = Math.max(0, g.score + pts);
        spawn('text', it.x - 4, it.y, { txt: (pts > 0 ? '+' : '') + pts, col: pts > 0 ? '#e9446f' : '#5b7bd6', vx: 0, vy: -20, life: .8, max: .8 });
        if (pts < 0){ c.vy = -50; c.jy = -1; boop(200, .15, 'sawtooth', .04, .5); } else boop(700 + pts * 120, .07, 'square', .04, 1.5);
        return false;
      }
      return it.y < H + 10;
    });
    $('gScore').textContent = '🍒 ' + g.score; $('gTime').textContent = '⏱ ' + Math.ceil(g.t);
    if (g.t <= 0) endGame();
  }

  // bath rinse
  if (bath){
    if (bath.rinse){
      bath.rinse -= dt;
      for (let i = 0; i < 3; i++) spawn('drop', bath.c.cx + (Math.random() - .5) * 50, GROUND - bath.c.h - 20, { vx: 0, vy: 140, life: .8, max: .8 });
      if (bath.rinse <= 0) endBath();
    }
  }

  // ambient chatter
  chatT -= dt;
  if (chatT < 0 && !busy() && hugT <= 0){
    chatT = 14 + Math.random() * 16;
    const c = chars[Math.floor(Math.random() * 2)];
    say(c, mood(c) < 35 ? lowLine(c) : c.lines[Math.floor(Math.random() * c.lines.length)]);
  }

  // ---------- draw ----------
  ctx.drawImage(bg, 0, 0);
  // fairy lights on curtain
  for (let i = 0; i < 14; i++){
    const x = 142 + (i * 7) % 36, y = 20 + i * 12 + Math.sin(i) * 4;
    const on = Math.sin(t * 2 + i * 1.7) > -.2;
    ctx.fillStyle = on ? '#ffe7a0' : '#efd9a8'; ctx.fillRect(x, y, 1, 1);
    if (on){ ctx.fillStyle = 'rgba(255,220,120,.35)'; ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
  }
  // locket photo in the wall frame
  if (framePhoto && framePhoto.complete && framePhoto.naturalWidth){
    const iw = framePhoto.naturalWidth, ih = framePhoto.naturalHeight, s = Math.min(iw, ih);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(framePhoto, (iw - s) / 2, (ih - s) / 2, s, s, 66, 28, 40, 40);
  }
  if (totalUnread() > 0){
    P = ctx; const ey = Math.round(18 + Math.sin(t * 4) * 2);
    pa(99, ey, 12, 8, '#4a2a35'); pa(100, ey + 1, 10, 6, '#fff'); pa(101, ey + 1, 1, 1, '#e7d3da'); pa(108, ey + 1, 1, 1, '#e7d3da');
    pa(102, ey + 2, 2, 1, '#e7d3da'); pa(106, ey + 2, 2, 1, '#e7d3da'); pa(104, ey + 3, 2, 1, '#e7d3da');
    sprite(HEART_S, 103.5, ey + 3, '#ff4f7e');
    if (Math.sin(t * 6) > .6) spawn('spark', 100 + Math.random() * 14, ey - 2, { vx: 0, vy: -6, life: .5, max: .5 });
  }

  // shadows
  chars.forEach(c => {
    const s = 1 + c.jy / 80;
    ctx.fillStyle = 'rgba(120,60,80,.18)';
    ctx.fillRect(Math.round(c.cx - 16 * s), GROUND - 1, Math.round(32 * s), 3);
    ctx.fillRect(Math.round(c.cx - 12 * s), GROUND - 2, Math.round(24 * s), 5);
  });

  // characters into layer
  lctx.clearRect(0, 0, W, H); P = lctx;
  const [g, m] = chars;
  const gb = charBox(g), mb = charBox(m);
  const gbob = Math.sin(t * 2.2) > .3 ? 1 : 0, mbob = Math.sin(t * 2.2 + 1.7) > .3 ? 1 : 0;
  const gs = [gb.x + 37, gb.y + gbob + 50], ms = [mb.x + 13, mb.y + mbob + 52];
  const hold = [(gs[0] + ms[0]) / 2, GROUND - 48 + Math.min(g.jy, m.jy) * .5];
  const canHold = !game && !bath && Math.hypot(hold[0] - ms[0], hold[1] - ms[1]) < 44;
  const gT = canHold ? hold : [gs[0] + 2, gs[1] + 22], mT = canHold ? [hold[0] + 1, hold[1]] : [ms[0] - 2, ms[1] + 24];
  g.draw(g, gb.x, gb.y, gbob, gT);
  m.draw(m, mb.x, mb.y, mbob, mT);
  OX = 0; OY = 0;
  // selection heart
  const sc = chars[sel], sb = charBox(sc);
  if (!game) sprite(HEART, Math.round(sc.cx - 2), Math.round(sb.y - 9 + Math.sin(t * 4) * 1.5), '#ff6f9a');
  outlinePass();
  ctx.drawImage(layer, 0, 0);

  // falling items + flying food
  ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (game) game.items.forEach(it => ctx.fillText(it.e, Math.round(it.x), Math.round(it.y)));
  flying.forEach(f => ctx.fillText(f.e, Math.round(f.cx), Math.round(f.cy)));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  drawParticles(dt);

  if (sleeping){
    ctx.fillStyle = 'rgba(30,30,80,.42)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff6c9'; ctx.fillRect(120, 22, 8, 8); ctx.fillStyle = 'rgba(30,30,80,.0)';
    ctx.fillStyle = '#3a3a72'; ctx.fillRect(123, 21, 6, 7);
    for (let i = 0; i < 6; i++) if (Math.sin(t * 3 + i * 2) > 0){ ctx.fillStyle = '#fff6c9'; ctx.fillRect(20 + i * 23, 14 + (i * 13) % 30, 1, 1); }
  }

  placeBubbles();
  secT += dt; if (secT > .5){ secT = 0; renderStats(); }
  saveT += dt; if (saveT > 10){ saveT = 0; save(); }
  requestAnimationFrame(frame);
}

// ---------- love box (letters, voice notes, locket photos) ----------
const LOVE = window.LOVE || {};
['letters', 'voice', 'photos'].forEach(k => { LOVE[k] = (LOVE[k] || []).slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); });
const ikey = (k, it) => k + '|' + (it.date || '') + '|' + (it.title || it.caption || '') + '|' + (it.src || '');
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('riri-seen') || '[]')); } catch(e){}
function markSeen(k, it){ seen.add(ikey(k, it)); try { localStorage.setItem('riri-seen', JSON.stringify([...seen])); } catch(e){} updateBadge(); }
const unreadOf = k => LOVE[k].filter(it => !seen.has(ikey(k, it))).length;
const totalUnread = () => unreadOf('letters') + unreadOf('voice') + unreadOf('photos');
function updateBadge(){
  const n = totalUnread(), d = $('boxDot'); d.textContent = n; d.style.display = n ? 'block' : 'none';
  document.querySelectorAll('.seg button').forEach(b => {
    const u = unreadOf(b.dataset.tab); b.querySelector('.n')?.remove();
    if (u) b.insertAdjacentHTML('beforeend', `<span class="n">${u}</span>`);
  });
}
let framePhoto = null;
if (LOVE.photos[0]){ framePhoto = new Image(); framePhoto.src = LOVE.photos[0].src; }
const fmtDate = d => { if (!d) return ''; const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
let boxTab = 'letters';
function openBox(tab){
  if (game || bath || sleeping) return toast('not right now!');
  if (!tab) tab = ['letters', 'voice', 'photos'].find(k => unreadOf(k)) || boxTab;
  $('box').classList.add('show'); showTab(tab);
}
function closeBox(){ $('box').classList.remove('show'); }
$('boxClose').onclick = closeBox;
$('box').onclick = e => { if (e.target.id === 'box') closeBox(); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { boop(880, .05); showTab(b.dataset.tab); });
function showTab(tab, idx){
  boxTab = tab;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const body = $('boxBody'), list = LOVE[tab], from = chars[1].name;
  body.innerHTML = '';
  if (!list.length){
    body.innerHTML = `<div class="empty">${{ letters:'no letters yet… 💭', voice:'no voice notes yet… 🥺<br>they\'ll show up here', photos:'no photos yet 📸' }[tab]}</div>`;
    return;
  }
  if (tab === 'photos'){
    const i = idx || 0, ph = list[i];
    body.innerHTML = `<div class="locket"><img alt=""><div class="cap"></div></div><div class="lmeta"></div><div class="thumbs"></div>`;
    body.querySelector('.locket img').src = ph.src;
    const cap = body.querySelector('.cap'); if (ph.caption) cap.textContent = ph.caption; else cap.remove();
    body.querySelector('.lmeta').textContent = `from ${ph.from || from} · ${fmtDate(ph.date)}`;
    const th = body.querySelector('.thumbs');
    if (list.length > 1) list.forEach((p2, j) => {
      const im = document.createElement('img'); im.src = p2.src; im.alt = ''; if (j === i) im.className = 'on';
      im.onclick = () => showTab('photos', j); th.appendChild(im);
    }); else th.remove();
    markSeen('photos', ph);
    return;
  }
  list.forEach((it, j) => {
    const b = document.createElement('button'); b.className = 'item';
    const isNew = !seen.has(ikey(tab, it));
    b.innerHTML = `<span class="ic">${tab === 'letters' ? (isNew ? '💌' : '✉️') : '🎧'}</span><span class="tt"></span>${isNew ? '<span class="new">NEW</span>' : ''}<span>${tab === 'voice' ? '▶' : '›'}</span>`;
    const tt = b.querySelector('.tt'); tt.textContent = it.title || (tab === 'letters' ? 'a letter' : 'voice note');
    tt.insertAdjacentHTML('beforeend', `<small>from ${esc(it.from || from)} · ${esc(fmtDate(it.date))}</small>`);
    b.onclick = () => { boop(760, .06); tab === 'letters' ? showLetter(it) : (closeBox(), markSeen('voice', it), playVoice(it)); };
    body.appendChild(b);
  });
}
function showLetter(l){
  markSeen('letters', l);
  const body = $('boxBody');
  body.innerHTML = `<div class="paper"><div class="ld"></div><h3></h3><div class="lb"></div><div class="sg"></div></div>
    <div class="prow"><button class="pbtn ghost" id="lBack">← back</button><button class="pbtn" id="lRead">🔊 have ${esc(chars[1].name)} read it to me</button></div>`;
  body.querySelector('.ld').textContent = fmtDate(l.date);
  body.querySelector('h3').textContent = l.title || '';
  body.querySelector('.lb').textContent = l.body || '';
  body.querySelector('.sg').textContent = '— ' + (l.from || chars[1].name) + ' 💕';
  body.scrollTop = 0;
  $('lBack').onclick = () => showTab('letters');
  $('lRead').onclick = () => { closeBox(); readLetter(l); };
}

let reading = null, voicePlaying = null;
function readLetter(l){
  stopMessages();
  const me = chars[1], her = chars[0];
  const parts = (l.body || '').split(/\n+|(?<=[.!?…])\s+/).map(x => x.trim()).filter(Boolean);
  const sp = window.speechSynthesis;
  reading = { i: 0, speaking: false };
  const r = reading;
  me.talking = true; me.fake = () => r.speaking;
  toast('tap anywhere to stop', 1800);
  const next = () => {
    if (reading !== r) return;
    if (r.i >= parts.length){ finishMessage('i love you too 🥺💕'); return; }
    const line = parts[r.i++];
    say(me, line, 60000, true);
    if (Math.random() < .5) hearts(her, 2);
    if (sp && window.SpeechSynthesisUtterance){
      const u = new SpeechSynthesisUtterance(line.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, ''));
      u.rate = .95; u.pitch = 1.05;
      let started = false, done = false;
      const fin = () => { if (done) return; done = true; r.speaking = false; setTimeout(next, 350); };
      u.onstart = () => { started = true; r.speaking = true; };
      const timed = () => { if (done) return; r.speaking = true; setTimeout(fin, 700 + line.length * 55); };
      u.onend = fin;
      u.onerror = () => started ? fin() : timed();
      sp.speak(u);
      // no voice available? fall back to timed subtitles
      setTimeout(() => { if (!started && !done && !r.speaking && reading === r) timed(); }, 1200);
    } else {
      r.speaking = true;
      setTimeout(() => { r.speaking = false; setTimeout(next, 300); }, 900 + line.length * 55);
    }
  };
  if (sp) sp.cancel();
  next();
}
function playVoice(v){
  stopMessages();
  const me = chars[1];
  const audio = new Audio(v.src);
  voicePlaying = audio;
  try {
    const a = ac(), srcNode = a.createMediaElementSource(audio);
    analyser = a.createAnalyser(); analyser.fftSize = 256;
    srcNode.connect(analyser); analyser.connect(a.destination);
    me.fake = null;
  } catch(e){ me.fake = () => !audio.paused; }
  me.talking = true;
  say(me, '🎧 ' + (v.title || 'voice note'), 600000, true);
  audio.onended = () => finishMessage('aww 🥺💕');
  audio.onerror = () => { stopMessages(); say(me, 'oops, that one won\'t play 😭'); };
  audio.play().catch(() => { stopMessages(); say(me, 'tap again to play 🎧'); });
  toast('tap anywhere to stop', 1800);
}
function stopMessages(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (voicePlaying){ voicePlaying.pause(); }
  reading = null; voicePlaying = null; analyser = null;
  const me = chars[1]; me.talking = false; me.fake = null;
  const b = bubbles.get(me); if (b){ b.el.remove(); clearTimeout(b.tm); bubbles.delete(me); }
}
function finishMessage(line){
  stopMessages();
  const her = chars[0];
  her.grinT = 2.5; her.vy = -70; her.jy = -1; hearts(her, 8); love = clamp(love + 5);
  say(her, line, 3000); chars[1].grinT = 2.5;
  boop(660, .1, 'sine', .06, 1.5); setTimeout(() => boop(990, .2, 'sine', .06, 1.5), 150);
}
if (totalUnread()) setTimeout(() => toast('💌 you have something new!', 3000), 900);

load(); drawBG(); renderTabs(); renderStats(); updateBadge();
window.__pet = { chars, say, actions, openBox, showTab, readLetter, get sel(){ return sel; }, set sel(v){ sel = v; renderTabs(); } };
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
})();
</script>
