<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Riri &amp; Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbeef0; --panel:#fff7f8; --ink:#4a2a35; --muted:#a07a86;
    --pink:#f49ab0; --pink-d:#e0708f; --line:#f1cdd6;
    --hunger:#ef6b7b; --fun:#f6b84b; --energy:#7cc3f0; --clean:#8fd6a8; --love:#ff7aa8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#2a1d24; --panel:#3a2832; --ink:#ffe9ef; --muted:#c49aa9; --line:#5a3d4a; }
  }
  :root[data-theme="dark"]{ --bg:#2a1d24; --panel:#3a2832; --ink:#ffe9ef; --muted:#c49aa9; --line:#5a3d4a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"Pixelify Sans", ui-monospace, monospace;
       display:flex; justify-content:center; user-select:none; -webkit-user-select:none; overflow:hidden}
  #app{width:100%; max-width:440px; height:100%; display:flex; flex-direction:column; padding:10px 12px 12px; gap:8px}
  header{display:flex; align-items:center; justify-content:space-between; gap:8px}
  h1{font-size:22px; margin:0; font-weight:700; letter-spacing:.5px}
  h1 span{color:var(--pink-d)}
  .love{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600}
  .love .bar{width:84px}
  .tabs{display:flex; gap:6px}
  .tab{flex:1; border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px;
       padding:6px 8px; font:inherit; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px}
  .tab.on{border-color:var(--pink-d); background:var(--pink); color:#fff}
  .tab small{font-size:11px; opacity:.8}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:8px 10px}
  .stat{display:flex; align-items:center; gap:6px; font-size:13px}
  .stat .ic{width:18px; text-align:center}
  .bar{flex:1; height:10px; background:var(--line); border-radius:3px; overflow:hidden}
  .bar i{display:block; height:100%; width:50%; transition:width .4s; background-image:linear-gradient(90deg,rgba(255,255,255,.25) 50%,transparent 50%); background-size:6px 100%}
  #stage{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  #wrap{position:relative; height:100%; aspect-ratio:180/260; max-width:100%; border-radius:14px; overflow:hidden; border:3px solid var(--line); box-shadow:0 6px 0 var(--line); background:#fff}
  #wrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges}
  #fx{touch-action:none; cursor:pointer}
  .spr{position:absolute; transform-origin:50% 100%; pointer-events:none; will-change:transform}
  .bubble{position:absolute; transform:translate(-50%,-100%); background:#fff; color:#4a2a35; border:2px solid #4a2a35; border-radius:10px; z-index:3;
          padding:5px 9px; font-size:14px; white-space:nowrap; pointer-events:none; box-shadow:0 3px 0 rgba(74,42,53,.25); --ax:50%}
  .bubble.in{animation:pop .18s ease-out}
  .bubble:after{content:""; position:absolute; left:var(--ax); bottom:-8px; margin-left:-6px; border:6px solid transparent; border-top-color:#4a2a35; border-bottom:0}
  .bubble.long{white-space:normal; width:max-content; max-width:min(86%,300px); text-align:center; line-height:1.3}
  .bubble.noarrow:after{display:none}
  @keyframes pop{from{opacity:0; scale:.6}}
  #toast{position:absolute; left:50%; top:10px; transform:translateX(-50%); background:rgba(74,42,53,.85); color:#fff; padding:5px 10px; border-radius:8px; font-size:13px; white-space:nowrap; opacity:0; transition:opacity .3s; pointer-events:none; z-index:4}
  #toast.show{opacity:1}
  #gamehud{position:absolute; left:8px; right:8px; top:8px; display:none; justify-content:space-between; font-size:16px; font-weight:700; color:#4a2a35; z-index:4}
  #camBtn{position:absolute; right:8px; top:8px; width:46px; height:46px; border-radius:50%; border:3px solid #4a2a35; background:#fff; font-size:22px; cursor:pointer; z-index:4;
          box-shadow:0 3px 0 rgba(74,42,53,.3); display:grid; place-items:center; padding:0}
  #camBtn:active{transform:translateY(2px)}
  .actions{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .btn{position:relative; border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:6px 0 4px; font:inherit; font-size:11px; font-weight:600;
       display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; box-shadow:0 3px 0 var(--line); transition:transform .08s}
  .btn b{font-size:20px; line-height:1.1; font-weight:400}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
  .btn.on{background:var(--pink); color:#fff; border-color:var(--pink-d)}
  .dot{position:absolute; top:-6px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:#ff4f7e; color:#fff; font-size:11px; line-height:18px; display:none; box-shadow:0 0 0 2px var(--bg); animation:pulse 1.4s infinite}
  @keyframes pulse{50%{transform:scale(1.15)}}
  #tray{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:none; gap:6px; background:rgba(255,247,248,.95); border:2px solid #4a2a35; border-radius:12px; padding:6px; z-index:4}
  #tray button{font-size:24px; background:none; border:0; cursor:pointer; padding:2px 4px}
  #tray.show{display:flex}

  /* sheets */
  .modal{position:fixed; inset:0; background:rgba(60,25,40,.45); display:none; align-items:flex-end; justify-content:center; z-index:10}
  .modal.show{display:flex}
  .sheet{width:100%; max-width:440px; max-height:90%; background:var(--panel); border-radius:18px 18px 0 0; border:3px solid var(--line); border-bottom:0;
         display:flex; flex-direction:column; animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px); opacity:0}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 6px; font-size:20px}
  .x{border:0; background:none; font:inherit; font-size:20px; color:var(--ink); cursor:pointer}
  .seg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; padding:4px 14px 10px}
  .seg button,.chip{position:relative; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:7px 0; font:inherit; font-size:14px; font-weight:600; cursor:pointer}
  .seg button.on,.chip.on{background:var(--pink); border-color:var(--pink-d); color:#fff}
  .seg .n{position:absolute; top:-7px; right:-5px; background:#ff4f7e; color:#fff; border-radius:8px; font-size:10px; padding:1px 5px}
  .body{overflow:auto; padding:0 14px 20px; min-height:240px}
  .item{width:100%; display:flex; align-items:center; gap:10px; text-align:left; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px;
        padding:10px 12px; margin-bottom:8px; font:inherit; cursor:pointer}
  .item .ic{font-size:26px} .item .tt{flex:1; font-size:15px; font-weight:600} .item small{display:block; font-weight:400; color:var(--muted); font-size:12px}
  .new{background:#ff4f7e; color:#fff; font-size:10px; border-radius:6px; padding:2px 6px; font-weight:700}
  .empty{text-align:center; color:var(--muted); padding:36px 10px; font-size:15px; line-height:1.5}
  .chips{display:flex; gap:6px; margin-bottom:12px}
  .chip{flex:1; padding:6px 0; font-size:13px}
  .pbtn{flex:1; border:2px solid var(--pink-d); background:var(--pink); color:#fff; border-radius:12px; padding:10px; font:inherit; font-size:15px; font-weight:600; cursor:pointer}
  .pbtn.ghost{background:var(--bg); color:var(--ink); border-color:var(--line); flex:0 0 auto}
  .prow{display:flex; gap:8px; margin-top:12px}

  /* envelopes */
  .envs{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px}
  .env{position:relative; aspect-ratio:1.5; border:0; padding:0; border-radius:8px; background:var(--ec); cursor:pointer; overflow:hidden; perspective:400px;
       box-shadow:0 4px 0 rgba(74,42,53,.15); font:inherit; color:#4a2a35; transition:transform .15s}
  .env:active{transform:scale(.97)}
  .env:before{content:""; position:absolute; inset:0;
    background:linear-gradient(to top right,transparent calc(50% - 1px),rgba(74,42,53,.13) 50%,transparent calc(50% + 1px)) left/50% 100% no-repeat,
               linear-gradient(to top left,transparent calc(50% - 1px),rgba(74,42,53,.13) 50%,transparent calc(50% + 1px)) right/50% 100% no-repeat}
  .env .paper-peek{position:absolute; left:10%; right:10%; top:8%; height:70%; background:#fffdf6; border-radius:3px; transform:translateY(60%); transition:transform .45s .1s;
       background-image:repeating-linear-gradient(transparent 0 7px,#f3dfe4 7px 8px)}
  .env .front{position:absolute; inset:0; background:var(--ec); clip-path:polygon(0 30%,50% 62%,100% 30%,100% 100%,0 100%)}
  .env .flap{position:absolute; left:0; right:0; top:0; height:62%; background:var(--ef); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:50% 0; transition:transform .45s; z-index:2}
  .env .seal{position:absolute; left:50%; top:60%; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%; background:#e0446a; color:#fff; z-index:3;
       display:grid; place-items:center; font-size:13px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 3px rgba(224,68,106,.25); transition:opacity .2s}
  .env .to{position:absolute; left:10px; bottom:6px; font-family:Caveat, cursive; font-size:21px; font-weight:700; z-index:3}
  .env .meta{position:absolute; right:8px; bottom:9px; font-size:10px; color:#8a6070; z-index:3}
  .env .new{position:absolute; top:6px; right:6px; z-index:4}
  .env.opened .flap{transform:rotateX(180deg); opacity:.55}
  .env.opened .seal{opacity:0}
  .env.opened .paper-peek{transform:translateY(0)}
  .env.opening .flap{transform:rotateX(180deg)}
  .env.opening .seal{opacity:0}
  .env.opening .paper-peek{transform:translateY(-20%)}
  .envlabel{font-size:12px; color:var(--muted); margin:4px 0 8px}
  .paper{background:#fffdf6; color:#4a2a35; border-radius:6px; padding:16px 18px 18px; box-shadow:0 3px 0 #ead9c2;
         background-image:repeating-linear-gradient(#fffdf6 0 27px,#f3dfe4 27px 28px); border-left:4px solid #f49ab0; font-family:Caveat, cursive; animation:up .3s ease-out}
  .paper .ld{font-family:"Pixelify Sans",monospace; font-size:12px; color:#b0808e}
  .paper h3{font-size:28px; margin:2px 0 6px; line-height:1.1}
  .paper .lb{font-size:22px; line-height:28px; white-space:pre-wrap; word-wrap:break-word}
  .paper .sg{text-align:right; font-size:24px; margin-top:8px}
  .compose input,.compose textarea{width:100%; border:2px solid var(--line); border-radius:10px; padding:8px 10px; font-family:Caveat, cursive; font-size:22px; background:#fffdf6; color:#4a2a35; margin-bottom:8px}
  .compose textarea{height:200px; resize:vertical; line-height:1.25}
  .hint{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.4}

  /* locket */
  .locket{position:relative; width:100%; aspect-ratio:1; border-radius:28px; overflow:hidden; background:#111; box-shadow:0 0 0 4px #f6c34a, 0 6px 0 4px #d9a531}
  .locket img,.locket video{width:100%; height:100%; object-fit:cover; display:block}
  .locket video.mirror{transform:scaleX(-1)}
  .cap{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(40,30,35,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#fff;
       padding:6px 14px; border-radius:20px; font-size:16px; white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis; border:0; font-family:inherit; text-align:center}
  input.cap{width:70%; outline:none}
  input.cap::placeholder{color:rgba(255,255,255,.75)}
  .lmeta{text-align:center; color:var(--muted); font-size:13px; margin:12px 0 8px}
  .thumbs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px}
  .thumbs img{width:56px; height:56px; object-fit:cover; border-radius:14px; border:3px solid transparent; cursor:pointer; flex:none}
  .thumbs img.on{border-color:#f6c34a}
  .camrow{display:flex; align-items:center; justify-content:space-around; margin-top:16px}
  .round{width:50px; height:50px; border-radius:50%; border:2px solid var(--line); background:var(--bg); font-size:22px; cursor:pointer; color:var(--ink)}
  .shutter{width:74px; height:74px; border-radius:50%; border:5px solid #f6c34a; background:#fff; cursor:pointer; box-shadow:inset 0 0 0 4px var(--panel)}
  .shutter:active{transform:scale(.94)}
  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
  .flash.go{animation:flash .35s}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .syncb{position:relative; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--panel); font-size:16px; cursor:pointer; padding:0; flex:none}
  .syncb i{position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; background:#bbb; border:2px solid var(--bg)}
  .syncb[data-s="on"] i{background:#4cc77a} .syncb[data-s="connecting"] i{background:#f6b84b} .syncb[data-s="error"] i{background:#ef4b5b}
  .field{width:100%; border:2px solid var(--line); border-radius:10px; padding:10px; font:inherit; font-size:15px; background:var(--bg); color:var(--ink); margin:6px 0 4px; letter-spacing:.5px}
  .stline{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px; background:var(--bg); border:2px solid var(--line); margin-bottom:12px; font-size:14px}
  .stline b{flex:1}
  .lbl{font-size:13px; color:var(--muted); margin:12px 0 4px}
  .rec{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .recdot{width:12px; height:12px; border-radius:50%; background:#ef4b5b; animation:pulse 1s infinite}
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:8px"><h1 id="title">Riri <span>&amp;</span> Me</h1><button class="syncb" id="syncBtn" aria-label="Sync">🔗<i></i></button></div>
    <div class="love">💗 <div class="bar"><i id="loveBar" style="background-color:var(--love)"></i></div><span id="loveNum">80%</span></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div class="stat"><span class="ic">🍒</span><div class="bar"><i id="s-hunger" style="background-color:var(--hunger)"></i></div></div>
    <div class="stat"><span class="ic">🎮</span><div class="bar"><i id="s-fun" style="background-color:var(--fun)"></i></div></div>
    <div class="stat"><span class="ic">⚡</span><div class="bar"><i id="s-energy" style="background-color:var(--energy)"></i></div></div>
    <div class="stat"><span class="ic">🫧</span><div class="bar"><i id="s-clean" style="background-color:var(--clean)"></i></div></div>
  </div>
  <div id="stage">
    <div id="wrap">
      <canvas id="bgc" width="180" height="260"></canvas>
      <img class="spr" id="sprRiri" src="img/riri.png" alt="Riri">
      <img class="spr" id="sprMe" src="img/me.png" alt="Me">
      <canvas id="fx" width="180" height="260"></canvas>
      <button id="camBtn" aria-label="Camera">📷</button>
      <div id="toast"></div>
      <div id="gamehud"><span id="gScore">🍒 0</span><span id="gTime">20</span></div>
      <div id="tray">
        <button data-food="🍒">🍒</button><button data-food="🍓">🍓</button><button data-food="🍜">🍜</button>
        <button data-food="🧋">🧋</button><button data-food="🍰">🍰</button><button data-food="🍙">🍙</button>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn" data-act="feed"><b>🍒</b>Feed</button>
    <button class="btn" data-act="play"><b>🎮</b>Play</button>
    <button class="btn" data-act="bath"><b>🫧</b>Bath</button>
    <button class="btn" data-act="sleep"><b>💤</b>Sleep</button>
    <button class="btn" data-act="talk"><b>🎤</b>Talk</button>
    <button class="btn" data-act="hug"><b>💕</b>Hug</button>
    <button class="btn" data-act="box"><b>💌</b>Letters<span class="dot" id="boxDot"></span></button>
  </div>
</div>

<div class="modal" id="box">
  <div class="sheet">
    <div class="sheet-head"><b>💌 Love Box</b><button class="x" data-close="box" aria-label="Close">✕</button></div>
    <div class="seg">
      <button data-tab="letters">✉️ Letters</button><button data-tab="voice">🎧 Voice</button><button data-tab="photos">📸 Photos</button>
    </div>
    <div class="body" id="boxBody"></div>
  </div>
</div>

<div class="modal" id="cam">
  <div class="sheet">
    <div class="sheet-head"><b>📷 Locket</b><button class="x" data-close="cam" aria-label="Close">✕</button></div>
    <div class="body" id="camBody"></div>
  </div>
</div>
<div class="modal" id="syncM">
  <div class="sheet">
    <div class="sheet-head"><b>🔗 Sync our phones</b><button class="x" data-close="syncM" aria-label="Close">✕</button></div>
    <div class="body" id="syncBody"></div>
  </div>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script src="sync-config.js"></script>
<script src="content.js"></script>
<script>
(() => {
'use strict';
const W = 180, H = 260, GROUND = 250;
const $ = id => document.getElementById(id);
const wrap = $('wrap');
const bgc = $('bgc'), bctx = bgc.getContext('2d');
const fx = $('fx'), ctx = fx.getContext('2d');
const LOVE = window.LOVE || {};
const clamp = v => Math.max(0, Math.min(100, v));
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[m]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function fetchStore(k, d){ try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch(e){ return d; } }

// ---------- pixel helpers (draw onto P) ----------
let P = ctx;
function pa(x, y, w, h, c){ P.fillStyle = c; P.fillRect(Math.round(x), Math.round(y), w, h); }
function sprite(rows, x, y, c, s = 1){
  P.fillStyle = c;
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === '1') P.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s); });
}
const HEART = ['11011','11111','11111','01110','00100'];
const HEART_S = ['101','111','010'];
function outline(c2){
  const w = c2.width, h = c2.height, x2 = c2.getContext('2d');
  const img = x2.getImageData(0, 0, w, h), d = img.data, a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 40 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = y * w + x; if (a[i]) continue;
    if ((x > 0 && a[i - 1]) || (x < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])){ d[i * 4] = 52; d[i * 4 + 1] = 28; d[i * 4 + 2] = 36; d[i * 4 + 3] = 255; }
  }
  x2.putImageData(img, 0, 0);
}

// ---------- the two of you (sprites cut from your picture) ----------
// Source art is 692x838 px (riri.png = left 330px, me.png = right 362px).
const K = 140 / 838, PAIR_W = 692 * K, PAIR_TOP = GROUND - 140;
const DEF = () => ({ hunger: 80, fun: 80, energy: 85, clean: 90 });
const chars = [
  { id:'riri', name:'Riri', el:$('sprRiri'), sx0:0, sw:330, headY:82, cxImg:140, mouth:[156,216], pitch:1.55, stats:DEF(),
    lines:['hehe that tickles!','i love you sm 💕','cherries are my fav 🍒','hold my hand?','you\'re so silly','hii babe!','kiss me? 😚','*giggles*','stay with me forever?'] },
  { id:'me', name:'Me', el:$('sprMe'), sx0:330, sw:362, headY:4, cxImg:530, mouth:[500,182], pitch:1.3, stats:DEF(),
    lines:['you\'re my favorite person','👍👍','hehe stop that!','wanna get food?','you look cute today','i\'m so lucky','best day ever','love you {o} 💕'] },
];
chars.forEach(c => Object.assign(c, { kind:'char', jy:0, vy:0, rot:0, grinT:0, eatT:0, wiggle:0, talking:false, listening:false, mouthAmp:0, fake:null }));
const charById = id => chars.find(c => c.id === id);
const nameOf = id => (charById(id) || {}).name || id || '';
let pairX = (W - PAIR_W) / 2;          // left edge of the pair (moves in the mini game)
function geo(c){
  const left = pairX + c.sx0 * K;

let actx = null;

function boop(f = 660, d = .08, type = 'square', vol = .05, slide = 0){
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, a.currentTime + d);
    g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d);
  } catch(e){}
}

function spawn(type, x, y, o = {}){ particles.push(Object.assign({ type, x, y, vx: (Math.random() - .5) * 10, vy: -12 - Math.random() * 10, life: 1.6, max: 1.6 }, o)); }
function hearts(x, y, n = 5){ for (let i = 0; i < n; i++) spawn('heart', x + (Math.random() - .5) * 30, y + Math.random() * 16, { col: ['#ff6f9a','#ff9ab8','#e9446f'][i % 3] }); }
function drawParticles(dt){
  P = ctx;
  particles = particles.filter(q => (q.life -= dt) > 0);
  particles.forEach(q => {
    q.x += q.vx * dt; q.y += q.vy * dt;
    ctx.globalAlpha = Math.min(1, q.life / q.max * 2);
    if (q.type === 'heart') sprite(q.small ? HEART_S : HEART, q.x, q.y, q.col);
    else if (q.type === 'z'){ ctx.fillStyle = '#7b8fd6'; ctx.font = (q.s || 8) + 'px "Pixelify Sans", monospace'; ctx.fillText('z', Math.round(q.x), Math.round(q.y)); }
    else if (q.type === 'bubble'){
      const r = q.r;
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(Math.round(q.x - r), Math.round(q.y - r + 1), r * 2, r * 2 - 2); ctx.fillRect(Math.round(q.x - r + 1), Math.round(q.y - r), r * 2 - 2, r * 2);
      ctx.fillStyle = 'rgba(120,180,230,.9)'; ctx.fillRect(Math.round(q.x - r), Math.round(q.y - r + 1), 1, r * 2 - 2); ctx.fillRect(Math.round(q.x - r + 1), Math.round(q.y - r), 1, 1);
    } else if (q.type === 'drop'){ ctx.fillStyle = '#7cc3f0'; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 3); }
    else if (q.type === 'spark'){ ctx.fillStyle = '#ffc93c'; ctx.fillRect(Math.round(q.x), Math.round(q.y - 1), 1, 3); ctx.fillRect(Math.round(q.x - 1), Math.round(q.y), 3, 1); }
    else if (q.type === 'text'){ ctx.fillStyle = q.col; ctx.font = 'bold 9px "Pixelify Sans", monospace'; ctx.fillText(q.txt, Math.round(q.x), Math.round(q.y)); }
  });
  ctx.globalAlpha = 1;
}

const bubbles = new Map();
function anchorOf(o){
  if (o.kind === 'pet'){ const b = petBox(o); return [o.cx, b.y - 3]; }
  const g = geo(o); return [g.cx, g.headY - 3];
}
function say(o, text, ms = 2600, long = false){
  if (o.kind === 'char') text = text.replace('{o}', other(o).name);
  const old = bubbles.get(o); if (old){ old.el.remove(); clearTimeout(old.tm); }
  const el = document.createElement('div');
  el.className = 'bubble in' + (long || text.length > 26 ? ' long' : '');
  el.textContent = text; wrap.appendChild(el);
  const tm = setTimeout(() => { el.remove(); bubbles.delete(o); }, ms);
  bubbles.set(o, { el, tm });
  placeBubbles();
}
function clearBubble(o){ const b = bubbles.get(o); if (b){ b.el.remove(); clearTimeout(b.tm); bubbles.delete(o); } }
function placeBubbles(){
  const sw = wrap.clientWidth, sh = wrap.clientHeight, s = sw / W;
  bubbles.forEach((b, o) => {
    const [ax, ay] = anchorOf(o), w = b.el.offsetWidth, h = b.el.offsetHeight, m = 6;
    let x = ax * s, y = ay * s;
    x = Math.max(w / 2 + m, Math.min(sw - w / 2 - m, x));
    const minY = h + m;
    b.el.classList.toggle('noarrow', y < minY);
    y = Math.max(minY, Math.min(sh - m, y));
    b.el.style.left = x + 'px'; b.el.style.top = y + 'px';
    const arrow = Math.max(14, Math.min(w - 14, ax * s - (x - w / 2)));
    b.el.style.setProperty('--ax', arrow + 'px');
  });
}

// ---------- talk (record + squeaky playback) ----------
let rec = null, recTimer = null, analyser = null;
async function talk(){
  if (sleeping || game || bath || reading || voicePlaying) return toast('not right now!');
  const c = chars[sel];
  if (rec){ rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ say(c, 'i can\'t hear you 🥺'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      clearTimeout(recTimer); stream.getTracks().forEach(tk => tk.stop());
      rec = null; c.listening = false; setOn('talk', false);
      try {
        const a = ac(), buf = await a.decodeAudioData(await new Blob(chunks).arrayBuffer());
        const src = a.createBufferSource(); src.buffer = buf; src.playbackRate.value = c.pitch;
        analyser = a.createAnalyser(); analyser.fftSize = 256;
        src.connect(analyser); analyser.connect(a.destination);
        c.talking = true; c.fake = null; src.onended = () => { c.talking = false; c.grinT = 1.2; analyser = null; };
        src.start();
      } catch(e){ say(c, 'huh? say again?'); }
    };
    rec.start(); c.listening = true; setOn('talk', true);
    say(c, 'i\'m listening… 👂', 4000);
    recTimer = setTimeout(() => rec && rec.stop(), 4000);
  } catch(e){ say(c, 'let me use the mic? 🎤'); }
}
const abuf = new Uint8Array(256);
function micLevel(){
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(abuf);
  let s = 0; for (let i = 0; i < abuf.length; i++){ const v = (abuf[i] - 128) / 128; s += v * v; }
  return Math.min(1, Math.sqrt(s / abuf.length) * 5);
}

function hitPet(x, y){ return pets.find(q => { const b = petBox(q); return x >= b.x - 3 && x <= b.x + b.w + 3 && y >= b.y - 3 && y <= b.y + b.h + 2; }); }

// ---------- main loop ----------
let last = performance.now(), saveT = 0, chatT = 16, secT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  decay(dt);
  const s = wrap.clientWidth / W;

  // pair position (moves together in the mini game)
  const pairTarget = game ? Math.max(0, Math.min(W - PAIR_W, game.x - PAIR_W / 2)) : (W - PAIR_W) / 2;
  pairX += (pairTarget - pairX) * Math.min(1, dt * (game ? 12 : 5));

  chars.forEach((c, i) => {
    c.vy += 400 * dt; c.jy = Math.min(0, c.jy + c.vy * dt); if (c.jy === 0) c.vy = 0;
    c.grinT -= dt; c.eatT -= dt; c.wiggle -= dt;
    if (c.talking) c.mouthAmp = c.fake ? (c.fake() ? (Math.sin(t * 17) + 1) * .4 + .1 : 0) : micLevel();
    else c.mouthAmp = 0;
    let rot = 0, sx = 1, sy = 1 + Math.sin(t * 2.2 + i * 1.7) * .006;
    if (hugT > 0) rot = i === 0 ? 5 : -5;
    if (c.wiggle > 0) rot += Math.sin(t * 30) * 3;
    if (c.eatT > 0){ const k = (Math.sin(t * 18) + 1) / 2; sy -= k * .035; sx += k * .02; }
    if (c.mouthAmp > .05){ sy += c.mouthAmp * .035; sx -= c.mouthAmp * .015; }
    if (c.listening) rot = (i === 0 ? 1 : -1) * 3;
    if (sleeping) rot = (i === 0 ? 4 : -4), sy *= .985;
    c.rot += (rot - c.rot) * Math.min(1, dt * 10);
    const g = geo(c);
    const el = c.el;
    el.style.left = g.left * s + 'px'; el.style.top = PAIR_TOP * s + 'px'; el.style.width = g.w * s + 'px';
    el.style.transform = `translateY(${c.jy * s}px) rotate(${c.rot}deg) scale(${sx},${sy})`;
  });
  hugT -= dt;
  pets.forEach(q => {
    q.vy += 400 * dt; q.jy = Math.min(0, q.jy + q.vy * dt); if (q.jy === 0) q.vy = 0;
    q.happyT -= dt; q.nb -= dt; if (q.nb < 0){ q.blink = .14; q.nb = 2 + Math.random() * 4; } q.blink -= dt;
    if (!sleeping && !busy() && Math.random() < dt * .04){ q.vy = -40; q.jy = -1; }
  });
  if (sleeping && Math.random() < dt * 1.4){
    const all = [...chars.map(c => [geo(c).cx + 8, geo(c).headY + 6]), ...pets.map(q => [q.cx + 6, petBox(q).y + 2])];
    const [zx, zy] = all[Math.floor(Math.random() * all.length)];
    spawn('z', zx, zy, { vx: 6, vy: -8, life: 2.2, max: 2.2, s: 7 + Math.floor(Math.random() * 4) });
  }

  // food flying to the mouth
  flying = flying.filter(f => {
    f.t += dt * 1.8; const k = Math.min(1, f.t), g = geo(f.c);
    f.cx = f.x + (g.mx - f.x) * k; f.cy = f.y + (g.my - f.y) * k - Math.sin(k * Math.PI) * 50;
    if (k >= 1){
      const [v, line] = FOOD[f.e], c = f.c;
      c.eatT = 1.3; c.stats.hunger = clamp(c.stats.hunger + v); c.stats.energy = clamp(c.stats.energy + 2);
      setTimeout(() => { say(c, line); const g2 = geo(c); hearts(g2.cx, g2.headY + 6, 2); c.grinT = 1.2; }, 1300);
      for (let i = 0; i < 4; i++) setTimeout(() => boop(300 + Math.random() * 80, .05, 'square', .04), i * 280);
      if (Math.random() < .5){ const q = pets[Math.floor(Math.random() * 2)]; setTimeout(() => say(q, q.id === 'cat' ? 'share? 🥺🐟' : 'can i have some?? 🐾', 1600), 600); }
      save(); return false;
    }
    return true;
  });

  // mini game: catch with both of you
  if (game){
    const g = game;
    g.t -= dt; g.spawn -= dt;
    if (g.spawn < 0){ g.spawn = .45 + Math.random() * .35; const r = Math.random(); g.items.push({ x: 10 + Math.random() * 160, y: -10, v: 45 + Math.random() * 35 + (20 - g.t) * 2, e: r < .12 ? '💖' : r < .24 ? '🌶️' : '🍒' }); }
    g.items = g.items.filter(it => {
      it.y += it.v * dt;
      const hitc = chars.find(c => { const gg = geo(c); return Math.abs(it.y - (gg.headY + 14)) < 12 && Math.abs(it.x - gg.cx) < 22; });
      if (hitc){
        const pts = it.e === '💖' ? 3 : it.e === '🌶️' ? -2 : 1;
        g.score = Math.max(0, g.score + pts);
        spawn('text', it.x - 4, it.y, { txt: (pts > 0 ? '+' : '') + pts, col: pts > 0 ? '#e9446f' : '#5b7bd6', vx: 0, vy: -20, life: .8, max: .8 });
        if (pts < 0){ hitc.vy = -50; hitc.jy = -1; hitc.wiggle = .4; boop(200, .15, 'sawtooth', .04, .5); } else boop(700 + pts * 120, .07, 'square', .04, 1.5);
        return false;
      }
      return it.y < H + 10;
    });
    $('gScore').textContent = '🍒 ' + g.score; $('gTime').textContent = '⏱ ' + Math.ceil(g.t);
    if (g.t <= 0) endGame();
  }
  if (bath && bath.rinse){
    bath.rinse -= dt;
    const g = geo(bath.c);
    for (let i = 0; i < 3; i++) spawn('drop', g.cx + (Math.random() - .5) * 50, g.headY - 20, { vx: 0, vy: 140, life: .8, max: .8 });
    if (bath.rinse <= 0) endBath();
  }

  // ambient chatter
  chatT -= dt;
  if (chatT < 0 && !busy() && hugT <= 0){
    chatT = 14 + Math.random() * 16;
    const r = Math.random();
    if (r < .2){ const q = pets[Math.floor(Math.random() * 2)]; say(q, q.lines[Math.floor(Math.random() * q.lines.length)], 2000); }
    else { const c = chars[Math.floor(Math.random() * 2)]; say(c, mood(c) < 35 ? lowLine(c) : c.lines[Math.floor(Math.random() * c.lines.length)]); }
  }

  // ---------- draw fx layer ----------
  ctx.clearRect(0, 0, W, H); P = ctx;
  // pets (pixel art with outline)
  pets.forEach(q => {
    pctx.clearRect(0, 0, 34, 34); q.draw(q, t); outline(petCanvas);
    const b = petBox(q);
    ctx.drawImage(petCanvas, Math.round(q.cx - 17), Math.round(GROUND - 34 + 2 + q.jy));
  });
  P = ctx;
  // selection heart
  if (!game && !sleeping){ const g = geo(chars[sel]); sprite(HEART, Math.round(g.cx - 2), Math.round(g.headY - 10 + Math.sin(t * 4) * 1.5), '#ff6f9a'); }
  // unread envelope on the polaroid
  if (totalUnread() > 0){
    const ey = Math.round(46 + Math.sin(t * 4) * 2);
    pa(36, ey, 13, 9, '#4a2a35'); pa(37, ey + 1, 11, 7, '#fff');
    pa(38, ey + 1, 1, 1, '#e7d3da'); pa(46, ey + 1, 1, 1, '#e7d3da'); pa(39, ey + 2, 2, 1, '#e7d3da'); pa(44, ey + 2, 2, 1, '#e7d3da'); pa(41, ey + 3, 3, 1, '#e7d3da');
    sprite(HEART_S, 41, ey + 4, '#ff4f7e');
    if (Math.sin(t * 6) > .6) spawn('spark', 36 + Math.random() * 14, ey - 2, { vx: 0, vy: -6, life: .5, max: .5 });
  }
  ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (game) game.items.forEach(it => ctx.fillText(it.e, Math.round(it.x), Math.round(it.y)));
  flying.forEach(f => ctx.fillText(f.e, Math.round(f.cx), Math.round(f.cy)));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  drawParticles(dt);
  if (sleeping){
    ctx.fillStyle = 'rgba(30,30,80,.42)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff6c9'; ctx.fillRect(150, 70, 8, 8); ctx.fillStyle = '#5b5b8f'; ctx.fillRect(153, 69, 6, 7);
    for (let i = 0; i < 7; i++) if (Math.sin(t * 3 + i * 2) > 0){ ctx.fillStyle = '#fff6c9'; ctx.fillRect(60 + i * 17, 20 + (i * 13) % 50, 1, 1); }
  }

  placeBubbles();
  secT += dt; if (secT > .5){ secT = 0; renderStats(); }
  saveT += dt; if (saveT > 10){ saveT = 0; save(false); }
  requestAnimationFrame(frame);
}

// ---------- reading letters / voice notes ----------
function readLetter(l){
  stopMessages();
  const reader = charById(l.from) || chars[1], listener = other(reader);
  const parts = (l.body || '').split(/\n+|(?<=[.!?…])\s+/).map(x => x.trim()).filter(Boolean);
  const sp = window.speechSynthesis;
  const r = reading = { i: 0, speaking: false };
  reader.talking = true; reader.fake = () => r.speaking;
  toast('tap anywhere to stop', 1800);
  const next = () => {
    if (reading !== r) return;
    if (r.i >= parts.length){ finishMessage(reader, listener === chars[0] ? 'i love you too 🥺💕' : 'i love you more 🥺💕'); return; }
    const line = parts[r.i++];
    say(reader, line, 60000, true);
    if (Math.random() < .5){ const g = geo(listener); hearts(g.cx, g.headY + 6, 2); }
    let started = false, done = false;
    const fin = () => { if (done) return; done = true; r.speaking = false; setTimeout(next, 350); };
    const timed = () => { if (done) return; r.speaking = true; setTimeout(fin, 700 + line.length * 55); };
    if (sp && window.SpeechSynthesisUtterance){
      const u = new SpeechSynthesisUtterance(line.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
      u.rate = .95; u.pitch = reader.id === 'riri' ? 1.45 : .95;
      u.onstart = () => { started = true; r.speaking = true; };
      u.onend = fin; u.onerror = () => started ? fin() : timed();
      sp.speak(u);
      setTimeout(() => { if (!started && !done && !r.speaking && reading === r) timed(); }, 1200);
    } else timed();
  };
  if (sp) sp.cancel();
  next();
}
function playVoice(v){
  stopMessages();
  const sp = charById(v.from) || chars[1];
  const audio = new Audio(v.src);
  voicePlaying = audio;
  try {
    const a = ac(), node = a.createMediaElementSource(audio);
    analyser = a.createAnalyser(); analyser.fftSize = 256;
    node.connect(analyser); analyser.connect(a.destination); sp.fake = null;
  } catch(e){ sp.fake = () => !audio.paused; }
  sp.talking = true;
  say(sp, '🎧 ' + (v.title || 'voice note'), 600000, true);
  audio.onended = () => finishMessage(sp, 'aww 🥺💕');
  audio.onerror = () => { stopMessages(); say(sp, 'oops, that one won\'t play 😭'); };
  audio.play().catch(() => { stopMessages(); say(sp, 'tap again to play 🎧'); });
  toast('tap anywhere to stop', 1800);
}
function stopMessages(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (voicePlaying) voicePlaying.pause();
  reading = null; voicePlaying = null; analyser = null;
  chars.forEach(c => { if (c.talking && !c.listening){ c.talking = false; c.fake = null; clearBubble(c); } });
}
function finishMessage(reader, line){
  stopMessages();
  const l = other(reader);
  l.grinT = 2.5; l.vy = -70; l.jy = -1; const g = geo(l); hearts(g.cx, g.headY + 6, 8); love = clamp(love + 5);
  pets.forEach(q => { q.happyT = 2; });
  say(l, line, 3000); reader.grinT = 2.5;
  boop(660, .1, 'sine', .06, 1.5); setTimeout(() => boop(990, .2, 'sine', .06, 1.5), 150);
}

// ---------- camera (Locket) ----------
let camStream = null, facing = 'user', shot = null;
$('camBtn').onclick = () => { ac(); boop(990, .06); openCam(); };
function stopCam(){ if (camStream){ camStream.getTracks().forEach(tk => tk.stop()); camStream = null; } }
async function openCam(){
  if (sleeping || game) return toast('not right now!');
  openModal('cam'); shot = null; stopCam();
  const body = $('camBody');
  body.innerHTML = `<div class="locket"><video playsinline autoplay muted></video><div class="flash"></div></div>
    <div class="camrow"><button class="round" id="camFile" aria-label="Pick a photo">🖼️</button><button class="shutter" id="camSnap" aria-label="Take photo"></button><button class="round" id="camFlip" aria-label="Flip camera">🔄</button></div>
    <div class="hint" style="text-align:center">snap what you're doing right now 💛</div>`;
  const video = body.querySelector('video');
  $('camFile').onclick = () => $('fileIn').click();
  $('camFlip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; openCam(); };
  $('camSnap').onclick = () => {
    if (!video.videoWidth) return $('fileIn').click();
    body.querySelector('.flash').classList.add('go'); boop(1400, .05, 'square', .05); setTimeout(() => boop(700, .08, 'square', .04), 60);
    const c = squareCanvas(video, video.videoWidth, video.videoHeight, facing === 'user');
    stopCam(); showShot(c.toDataURL('image/jpeg', .82));
  };
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw 0;
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    if (!$('cam').classList.contains('show')){ stopCam(); return; }
    video.srcObject = camStream; video.classList.toggle('mirror', facing === 'user');
  } catch(e){
    body.querySelector('.locket').innerHTML = `<div class="empty" style="color:#fff">camera not available 🥺<br>tap 🖼️ to pick a photo instead</div>`;
  }
}
function squareCanvas(src, w, h, mirror){
  const s = Math.min(w, h), out = document.createElement('canvas'); out.width = out.height = 720;
  const x = out.getContext('2d');
  if (mirror){ x.translate(720, 0); x.scale(-1, 1); }
  x.drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 720, 720);
  return out;
}
$('fileIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const im = new Image();
  im.onload = () => { stopCam(); showShot(squareCanvas(im, im.naturalWidth, im.naturalHeight, false).toDataURL('image/jpeg', .82)); URL.revokeObjectURL(im.src); };
  im.src = URL.createObjectURL(f);
  if (!$('cam').classList.contains('show')) openModal('cam');
};
function showShot(data){
  shot = data;
  const body = $('camBody');
  let from = myId();
  body.innerHTML = `<div class="locket"><img alt=""><input class="cap" id="shotCap" maxlength="40" placeholder="add a message…"></div>
    <div class="chips" style="margin-top:12px"><button class="chip" data-w="riri">from ${esc(chars[0].name)}</button><button class="chip" data-w="me">from ${esc(chars[1].name)}</button></div>
    <div class="prow"><button class="pbtn ghost" id="shRetake">↺</button><button class="pbtn" id="shSave">💛 add to our locket</button></div>`;
  body.querySelector('img').src = data;
  const chips = body.querySelectorAll('.chip');
  const setFrom = id => { from = id; chips.forEach(c => c.classList.toggle('on', c.dataset.w === id)); };
  chips.forEach(c => c.onclick = () => setFrom(c.dataset.w)); setFrom(from);
  $('shRetake').onclick = openCam;
  $('shSave').onclick = () => {
    const ph = { date: today(), ts: Date.now(), from, caption: $('shotCap').value.trim(), src: shot, local: true };
    addItem('photos', ph);
    seen.add(ikey('photos', ph)); store('riri-seen', [...seen]); updateBadge();
    setFramePhoto(ph.src);
    chars.forEach(c => { c.grinT = 2; c.vy = -60; c.jy = -1; }); pets.forEach(q => { q.happyT = 2; });
    hearts(26, 30, 6); boop(880, .1, 'sine', .06, 1.5);
    body.innerHTML = `<div class="locket"><img alt="">${ph.caption ? '<div class="cap"></div>' : ''}</div>
      <div class="lmeta">${synced() ? 'sent to both of your lockets 💛' : 'saved to your locket 💛 it\'s on the wall now'}</div>
      <div class="prow"><button class="pbtn ghost" id="shDone">done</button><button class="pbtn" id="shSend">📤 send to ${esc(nameOf(from === 'riri' ? 'me' : 'riri'))}</button></div>`;
    body.querySelector('img').src = ph.src;
    if (ph.caption) body.querySelector('.cap').textContent = ph.caption;
    $('shDone').onclick = () => closeModal('cam');
    $('shSend').onclick = () => sharePhoto(ph);
  };
}
async function sharePhoto(ph){
  try {
    const blob = await (await fetch(ph.src)).blob();
    const file = new File([blob], `locket-${ph.date}.jpg`, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], text: ph.caption || '📸💛' }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    toast('saved! send it to them 💕');
  } catch(e){ if (e.name !== 'AbortError') toast('couldn\'t share 🥺'); }
}

// ---------- voice notes recorded in the app ----------
let vRec = null;
function voiceRecorderUI(body){
  const box = document.createElement('div');
  box.innerHTML = `<div class="rec"><button class="pbtn" id="vRecBtn">🎙️ record a voice note</button></div>`;
  body.appendChild(box);
  const btn = box.querySelector('#vRecBtn');
  if (vRec){ btn.textContent = '⏹ stop & send'; }
  btn.onclick = async () => {
    if (vRec){ vRec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) return toast('recording isn\'t supported here 🥺');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      let mr; try { mr = new MediaRecorder(stream, { audioBitsPerSecond: 24000 }); } catch(e){ mr = new MediaRecorder(stream); }
      vRec = mr;
      const started = Date.now();
      const tick = setInterval(() => { const n = Math.floor((Date.now() - started) / 1000); btn.textContent = `⏹ stop & send  (${n}s / 30s)`; if (n >= 30) mr.stop(); }, 250);
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        clearInterval(tick); stream.getTracks().forEach(tk => tk.stop()); vRec = null;
        const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        if (Date.now() - started < 800){ showTab('voice'); return; }
        const rd = new FileReader();
        rd.onload = () => {
          const title = (prompt('name this voice note:', 'hi baby 💕') || 'voice note').slice(0, 40);
          const v = { date: today(), ts: Date.now(), from: myId(), title, src: rd.result, local: true };
          addItem('voice', v);
          seen.add(ikey('voice', v)); store('riri-seen', [...seen]); updateBadge();
          toast(synced() ? 'sent 🎧💕' : 'saved on this phone 🎧'); boop(880, .1, 'sine', .05, 1.5);
          showTab('voice');
        };
        rd.readAsDataURL(blob);
      };
      mr.start(); btn.textContent = '⏹ stop & send  (0s / 30s)'; boop(660, .08, 'sine', .05);
    } catch(e){ toast('let me use the mic? 🎤'); }
  };
}

// ---------- sync screen ----------
const syncBtn = $('syncBtn');
syncBtn.onclick = () => { boop(880, .05); openSync(); };
function genCode(){ const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = 'riri'; for (let i = 0; i < 4; i++){ s += '-'; for (let j = 0; j < 4; j++) s += a[Math.floor(Math.random() * a.length)]; } return s; }
function openSync(){ openModal('syncM'); renderSync(); }
function renderSync(){
  const S = window.Sync, body = $('syncBody');
  if (!$('syncM').classList.contains('show')) return;
  if (!S){ body.innerHTML = `<div class="empty">loading…</div>`; return; }
  const whoChips = `<div class="lbl">this phone belongs to…</div>
    <div class="chips"><button class="chip" data-who="riri">🎀 ${esc(chars[0].name)}</button><button class="chip" data-who="me">👓 ${esc(chars[1].name)}</button></div>`;
  if (!S.configured){
    body.innerHTML = `<div class="empty">sync isn't set up yet 🛠️<br><small>add your Cloudflare Worker address to <b>sync-config.js</b>.<br>steps are in README.md</small></div>${whoChips}`;
  } else if (S.status === 'on' || S.status === 'connecting'){
    body.innerHTML = `<div class="stline">${S.status === 'on' ? '🟢' : '🟡'} <b>${S.status === 'on' ? 'synced! your phones are connected 💕' : 'connecting…'}</b></div>
      <div class="lbl">your secret pair code</div><input class="field" readonly value="${esc(S.room || '')}">
      <div class="prow"><button class="pbtn" id="shareCode">📤 send code to ${esc(chars[who === 'me' ? 0 : 1].name)}</button></div>
      ${whoChips}
      <div class="prow"><button class="pbtn ghost" id="unpair" style="flex:1">unpair this phone</button></div>
      <div class="hint">letters, photos, voice notes and your pets' stats are shared. keep the code secret, anyone with it can see your stuff.</div>`;
    $('shareCode').onclick = async () => {
      const link = location.origin + location.pathname + '#join=' + S.room;
      const text = `join me in our little game 💕 ${link}`;
      try { if (navigator.share){ await navigator.share({ text }); return; } } catch(e){ if (e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(link); toast('link copied! send it 💕'); } catch(e){ toast(S.room); }
    };
    $('unpair').onclick = () => { if (confirm('unpair this phone? (nothing is deleted)')){ S.disconnect(); remote.letters = []; remote.photos = []; remote.voice = []; updateBadge(); renderSync(); } };
  } else {
    body.innerHTML = `${S.status === 'error' ? `<div class="stline">🔴 <b>${esc(S.error || 'couldn\'t connect')}</b></div>` : ''}
      <div class="lbl">first phone: make a code. second phone: type the same code (or open the link they sent)</div>
      <input class="field" id="codeIn" placeholder="riri-xxxx-xxxx-xxxx-xxxx" autocapitalize="off" autocomplete="off" spellcheck="false">
      <div class="prow"><button class="pbtn ghost" id="mkCode">✨ new code</button><button class="pbtn" id="pair">🔗 connect</button></div>
      ${whoChips}
      <div class="hint">pick who you are first, so letters and photos are signed right 💕</div>`;
    const inp = $('codeIn'); inp.value = fetchStore('riri-lastcode', '') || '';
    $('mkCode').onclick = () => { inp.value = genCode(); };
    $('pair').onclick = () => {
      const c = inp.value.trim().toLowerCase();
      if (c.length < 16) return toast('code must be at least 16 characters');
      store('riri-lastcode', c);
      S.connect(c); renderSync();
    };
  }
  body.querySelectorAll('[data-who]').forEach(b => {
    b.classList.toggle('on', b.dataset.who === who);
    b.onclick = () => { who = b.dataset.who; store('riri-who', who); sel = chars.indexOf(charById(who)); renderTabs(); renderSync(); };
  });
}
function migrateLocal(){
  // first time this phone connects: move anything saved only on this phone into the shared box
  [['letters', localLetters], ['photos', localPhotos], ['voice', localVoice]].forEach(([k, arr]) => {
    if (!arr.length) return;
    arr.slice().forEach(it => { it.id = it.id || newId(k); window.Sync.add(k, it).then(() => { const i = arr.indexOf(it); if (i >= 0) arr.splice(i, 1); store('riri-' + k, arr); }).catch(() => {}); });
  });
}
window.addEventListener('sync:status', e => {
  syncBtn.dataset.s = e.detail.status;
  if (e.detail.status === 'on') migrateLocal();
  renderSync();
});
window.addEventListener('sync:ready', () => { syncBtn.dataset.s = window.Sync.status; renderSync(); });
window.addEventListener('sync:items', e => {
  const { kind, items, added } = e.detail;
  remote[kind] = items;
  if (kind === 'photos'){ const top = lists.photos()[0]; if (top && (!framePhoto || framePhoto.src !== new URL(top.src, location.href).href)) setFramePhoto(top.src); }
  const forMe = added.filter(it => it.from && it.from !== who);
  if (forMe.length){
    const it = forMe[0], n = nameOf(it.from);
    toast({ letters: `💌 new letter from ${n}!`, photos: `📸 ${n} posted a photo!`, voice: `🎧 voice note from ${n}!` }[kind], 3500);
    boop(880, .1, 'sine', .06, 1.5); setTimeout(() => boop(1320, .15, 'sine', .05, 1.2), 140);
    pets.forEach(q => { q.happyT = 2; q.vy = -50; q.jy = -1; });
  }
  updateBadge();
  if ($('box').classList.contains('show') && boxTab === kind && !$('boxBody').querySelector('.paper,.compose,.locket')) showTab(kind);
});
window.addEventListener('sync:state', e => {
  const st = e.detail;
  if (!st || st.ts < stateTs){ if (stateTs) pushState(); return; }   // ours is newer (or nothing shared yet)
  if (st.by === deviceId || st.ts === stateTs) return;
  (st.chars || []).forEach((c, i) => { if (chars[i]){ if (c.name) chars[i].name = c.name; Object.assign(chars[i].stats, c.stats || {}); } });
  if (typeof st.love === 'number') love = st.love;
  stateTs = st.ts;
  decay(Math.max(0, (Date.now() - st.ts) / 1000));
  save(false); renderTabs(); renderStats();
});
if (who) sel = chars.indexOf(charById(who));

// ---------- start ----------
load(); renderTabs(); renderStats(); updateBadge();
setFramePhoto((lists.photos()[0] || {}).src);
if (totalUnread()) setTimeout(() => toast('💌 you have something new!', 3000), 900);
window.__pet = { chars, pets, say, actions, openBox, showTab, readLetter, openCam, showShot, geo };
window.addEventListener('resize', placeBubbles);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(false); });
requestAnimationFrame(frame);
})();
</script>
